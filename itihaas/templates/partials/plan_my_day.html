{# "Plan My Day" itinerary generator, opened from the profile menu. #}
    <div class="modal fade" id="planMyDayModal" tabindex="-1" role="dialog" aria-labelledby="planMyDayTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="planMyDayTitle">Plan Your Perfect Day</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span>&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form id="planForm">
              <!-- State Selection -->
              <div class="form-group">
                <label>Select State</label>
                <select class="form-control" id="planState" required>
                  <option value="">Select a state</option>
                  <option value="delhi">Delhi</option>
                  <option value="agra">Agra, Uttar Pradesh</option>
                  <option value="rajasthan">Rajasthan</option>
                  <option value="kerala">Kerala</option>
                  <option value="goa">Goa</option>
                  <option value="mumbai">Mumbai, Maharashtra</option>
                  <option value="varanasi">Varanasi, Uttar Pradesh</option>
                  <option value="amritsar">Amritsar, Punjab</option>
                  <option value="darjeeling">Darjeeling, West Bengal</option>
                  <option value="mysore">Mysore, Karnataka</option>
                </select>
              </div>

              <!-- Time Available -->
              <div class="form-group">
                <label>How much time do you have?</label>
                <select class="form-control" id="planTime" required>
                  <option value="">Select time</option>
                  <option value="half">Half Day (4-5 hours)</option>
                  <option value="full">Full Day (8-10 hours)</option>
                  <option value="two">Two Days</option>
                </select>
              </div>

              <!-- Interests -->
              <div class="form-group">
                <label>What interests you most?</label>
                <div class="row">
                  <div class="col-md-6">
                    <div class="custom-control custom-checkbox">
                      <input type="checkbox" class="custom-control-input" id="plan-architecture" name="interests" value="architecture">
                      <label class="custom-control-label" for="plan-architecture">Architecture</label>
                    </div>
                    <div class="custom-control custom-checkbox">
                      <input type="checkbox" class="custom-control-input" id="plan-history" name="interests" value="history">
                      <label class="custom-control-label" for="plan-history">History</label>
                    </div>
                    <div class="custom-control custom-checkbox">
                      <input type="checkbox" class="custom-control-input" id="plan-culture" name="interests" value="culture">
                      <label class="custom-control-label" for="plan-culture">Culture</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="custom-control custom-checkbox">
                      <input type="checkbox" class="custom-control-input" id="plan-religion" name="interests" value="religion">
                      <label class="custom-control-label" for="plan-religion">Religion</label>
                    </div>
                    <div class="custom-control custom-checkbox">
                      <input type="checkbox" class="custom-control-input" id="plan-nature" name="interests" value="nature">
                      <label class="custom-control-label" for="plan-nature">Nature</label>
                    </div>
                    <div class="custom-control custom-checkbox">
                      <input type="checkbox" class="custom-control-input" id="plan-food" name="interests" value="food">
                      <label class="custom-control-label" for="plan-food">Food</label>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Pace -->
              <div class="form-group">
                <label>What's your preferred pace?</label>
                <select class="form-control" id="planPace" required>
                  <option value="">Select pace</option>
                  <option value="relaxed">Relaxed - Take your time</option>
                  <option value="moderate">Moderate - Balanced pace</option>
                  <option value="intensive">Intensive - Pack it all in</option>
                </select>
              </div>

              <!-- Results Section (Initially Hidden) -->
              <div id="planResults" style="display: none;">
                <h6 class="mt-4 mb-3">Your Personalized Itinerary</h6>
                <div id="planContent" class="border rounded p-3">
                  <!-- Content will be populated by JavaScript -->
                </div>
                <button type="button" class="btn btn-secondary mt-3" onclick="resetPlanForm()">Plan Another Day</button>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary" id="planGenerate">Generate Itinerary</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Update the JavaScript section -->
